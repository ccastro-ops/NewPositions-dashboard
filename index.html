<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seguimiento — Senior Automation SDET (IA)</title>
<style>
  :root { color-scheme: light; }

  .viz-root {
    --brand-red:    #BB240A;
    --brand-blue:   #322470;
    --brand-cream:  #E5DBD1;
    --brand-yellow: #EDCC4D;
    --brand-brown:  #623F1B;
    --brand-black:  #0B0B0B;

    --page-plane:     #FAF6F0;
    --surface-1:      #FFFFFF;
    --surface-tint:   #E5DBD1;
    --text-primary:   #0B0B0B;
    --text-secondary: #623F1B;
    --text-muted:     #8A7563;
    --gridline:       #E9E0D6;
    --baseline:       #D8CBBC;
    --border:         rgba(98,63,27,0.16);
    --accent:         #322470;
    --accent-ink:     #FFFFFF;
    --status-progress:#BB240A;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) .viz-root {
      color-scheme: dark;
      --page-plane:     #0B0B0B;
      --surface-1:      #1E140B;
      --surface-tint:   #2A1D10;
      --text-primary:   #F3EAE0;
      --text-secondary: #E5DBD1;
      --text-muted:     #B7A48F;
      --gridline:       #362A1D;
      --baseline:       #4A3A28;
      --border:         rgba(229,219,209,0.14);
      --accent:         #6C5CD8;
      --accent-ink:     #FFFFFF;
      --status-progress:#E1543A;
    }
  }
  :root[data-theme="dark"] .viz-root {
    color-scheme: dark;
    --page-plane:     #0B0B0B;
    --surface-1:      #1E140B;
    --surface-tint:   #2A1D10;
    --text-primary:   #F3EAE0;
    --text-secondary: #E5DBD1;
    --text-muted:     #B7A48F;
    --gridline:       #362A1D;
    --baseline:       #4A3A28;
    --border:         rgba(229,219,209,0.14);
    --accent:         #6C5CD8;
    --accent-ink:     #FFFFFF;
    --status-progress:#E1543A;
  }

  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--page-plane); color: var(--text-primary); }
  .wrap { max-width: 980px; margin: 0 auto; padding: 32px 20px 60px; }
  header.top { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 28px; flex-wrap: wrap; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .subtitle { color: var(--text-primary); font-size: 14px; margin: 0; }
  .updated { color: var(--text-primary); font-size: 13px; margin-top: 6px; }
  .toggle-group { display: flex; gap: 8px; }
  button.toggle-btn { border: 1px solid var(--border); background: var(--surface-1); color: var(--text-primary); border-radius: 8px; padding: 8px 12px; font-size: 13px; cursor: pointer; }
  button.toggle-btn.accent { background: var(--accent); color: var(--accent-ink); border-color: transparent; font-weight: 600; }
  .tab-bar { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 28px; border-bottom: 1px solid var(--border); }
  .tab-btn { border: none; background: transparent; color: var(--text-primary); font-size: 13.5px; font-weight: 600; padding: 10px 4px; margin-right: 22px; cursor: pointer; border-bottom: 3px solid transparent; opacity: 0.55; }
  .tab-btn:hover { opacity: 0.85; }
  .tab-btn.active { opacity: 1; border-bottom-color: var(--accent); color: var(--accent); }
  .card { background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px; padding: 20px; }
  .stat-tile { padding: 16px; }
  .stat-label { font-size: 12px; color: var(--text-primary); margin-bottom: 8px; }
  .stat-value { font-size: 28px; font-weight: 600; line-height: 1; }
  .stat-hint { font-size: 11px; color: var(--text-primary); margin-top: 6px; }
  section { margin-bottom: 32px; }
  h2 { font-size: 16px; margin: 0 0 3px; display: flex; align-items: center; }
  .section-hint { font-weight: 400; font-size: 12px; color: var(--text-primary); display: block; margin: 0 0 14px 20px; }
  h2::before { content: ""; width: 11px; height: 11px; border-radius: 3px; margin-right: 9px; flex: none; }
  h2.accent-blue::before { background: var(--brand-blue); }
  h2.accent-red::before { background: var(--brand-red); }
  h2.accent-yellow::before { background: var(--brand-yellow); }
  h2.accent-brown::before { background: var(--brand-brown); }
  .analysis-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px 20px; }
  @media (max-width: 560px) { .analysis-grid { grid-template-columns: 1fr; } }
  .analysis-item .field-label { color: var(--text-primary); font-size: 11.5px; text-transform: uppercase; letter-spacing: .03em; margin-bottom: 3px; }
  .analysis-item .field-value { font-size: 13.5px; }
  .analysis-item .field-value.pending { color: var(--text-primary); font-style: italic; }
  .stat-tile.accent-red    { border-left: 4px solid var(--brand-red); }
  .stat-tile.accent-blue   { border-left: 4px solid var(--brand-blue); }
  .stat-tile.accent-brown  { border-left: 4px solid var(--brand-brown); }
  .stat-tile.accent-yellow { border-left: 4px solid var(--brand-yellow); }

  /* Project status timeline */
  .timeline { display: flex; align-items: flex-start; margin: 4px 0 4px; }
  .timeline-step { flex: 1; display: flex; flex-direction: column; align-items: center; text-align: center; position: relative; }
  .timeline-step:not(:first-child)::before { content: ""; position: absolute; top: 11px; left: -50%; width: 100%; height: 2px; background: var(--baseline); z-index: 0; }
  .timeline-step.done:not(:first-child)::before { background: var(--accent); }
  .timeline-dot { width: 24px; height: 24px; border-radius: 50%; background: var(--surface-1); border: 2px solid var(--baseline); display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; z-index: 1; color: var(--text-primary); }
  .timeline-step.done .timeline-dot { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .timeline-step.current .timeline-dot { background: var(--surface-1); border-color: var(--accent); color: var(--accent); box-shadow: 0 0 0 4px rgba(50,36,112,0.15); }
  .timeline-label { font-size: 11px; margin-top: 8px; color: var(--text-primary); max-width: 110px; line-height: 1.3; padding: 0 4px; }
  .timeline-step.current .timeline-label { color: var(--text-primary); font-weight: 700; }
  .timeline-step.done .timeline-label { color: var(--text-primary); }
  @media (max-width: 640px) { .timeline-label { font-size: 9.5px; max-width: 78px; } .timeline-dot { width: 20px; height: 20px; } }
  .status-stats-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-top: 20px; }
  .status-stats-grid .stat-tile { background: var(--page-plane); border: 1px solid var(--border); border-radius: 10px; }

  /* Mode / distribution chart */
  .mode-chart { display: flex; flex-direction: column; gap: 10px; }
  .mode-row { display: grid; grid-template-columns: 190px 1fr; align-items: center; gap: 10px; }
  @media (max-width: 720px) { .mode-row { grid-template-columns: 1fr; gap: 4px; } }
  .mode-row-label { font-size: 12.5px; color: var(--text-primary); }
  .mode-bar { display: flex; height: 10px; border-radius: 999px; overflow: hidden; background: var(--gridline); }
  .mode-seg.good { background: #0ca30c; }
  .mode-seg.warning { background: #fab219; }
  .mode-seg.critical { background: #d03b3b; }
  .mode-seg.pending { background: var(--baseline); }
  .mode-row-count { font-size: 11.5px; color: var(--text-primary); }
  .mode-legend { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--gridline); }
  .mode-legend-item { display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--text-primary); }
  .mode-legend-dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
  .mode-legend-dot.good { background: #0ca30c; }
  .mode-legend-dot.warning { background: #fab219; }
  .mode-legend-dot.critical { background: #d03b3b; }
  .mode-legend-dot.pending { background: var(--baseline); }

  /* Chip list (locations) */
  .chip-list { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { font-size: 12px; padding: 3px 10px; border-radius: 999px; background: var(--surface-tint); color: var(--text-primary); border: 1px solid var(--border); }

  .evolution-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 720px) { .evolution-grid { grid-template-columns: 1fr; } }
  .evo-card { border-top: 3px solid var(--baseline); }
  .evo-card.before-card { border-top-color: var(--brand-brown); }
  .evo-card.after-card { border-top-color: var(--brand-blue); }
  .evo-card h3 { font-size: 14px; margin: 0 0 10px; display: flex; align-items: center; gap: 8px; }
  .evo-tag { font-size: 11px; padding: 2px 8px; border-radius: 999px; font-weight: 600; }
  .evo-tag.before { background: rgba(98,63,27,0.16); color: var(--brand-brown); }
  .evo-tag.after { background: var(--brand-yellow); color: var(--brand-black); }
  .evo-card ul { margin: 0; padding-left: 18px; font-size: 13.5px; color: var(--text-primary); line-height: 1.6; }
  .evo-card li { margin-bottom: 6px; }
  details.full-text { margin-top: 12px; border-top: 1px solid var(--gridline); padding-top: 10px; }
  details.full-text summary { cursor: pointer; font-size: 12.5px; color: var(--accent); font-weight: 600; }
  details.full-text .body-text { font-size: 13px; color: var(--text-primary); line-height: 1.6; margin-top: 10px; white-space: pre-wrap; }
  .empty-state { text-align: center; padding: 24px 20px; color: var(--text-primary); font-size: 13.5px; border: 1px dashed var(--baseline); border-radius: 10px; margin-bottom: 16px; }
  .empty-state.accent-yellow { border-color: rgba(237,204,77,0.7); }
  .empty-state strong { color: var(--text-primary); display: block; margin-bottom: 6px; font-size: 14px; }
  .progress-note { font-size: 12.5px; color: var(--text-primary); margin: 0 0 12px; }
  .candidate-card { border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  .candidate-card + .candidate-card { margin-top: 10px; }
  .candidate-summary { padding: 14px 16px; cursor: pointer; display: flex; align-items: center; justify-content: space-between; font-size: 14px; font-weight: 600; list-style: none; }
  .candidate-summary::-webkit-details-marker { display: none; }
  .candidate-summary .chev { color: var(--text-primary); font-size: 12px; }
  .candidate-name-done { color: #0ca30c; }
  .candidate-badge { font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: var(--brand-brown); background: rgba(237,204,77,0.3); border: 1px solid transparent; padding: 2px 8px; border-radius: 999px; margin-left: 10px; }
  .candidate-body { padding: 0 16px 16px; }
  .field-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px 20px; font-size: 13px; }
  @media (max-width: 560px) { .field-grid { grid-template-columns: 1fr; } }
  .field-label { color: var(--text-primary); font-size: 11.5px; text-transform: uppercase; letter-spacing: .03em; margin-bottom: 2px; }
  .field-value { color: var(--text-primary); }
  .field-value a { color: var(--accent); }
  .field-value.pending { color: var(--text-primary); font-style: italic; }
  .checklist { margin-top: 16px; border-top: 1px solid var(--gridline); padding-top: 12px; }
  .checklist-title { font-size: 11.5px; text-transform: uppercase; letter-spacing: .03em; color: var(--text-primary); margin-bottom: 8px; }
  .checklist-row { display: flex; align-items: center; gap: 8px; font-size: 13px; padding: 5px 0; border-bottom: 1px solid var(--gridline); }
  .checklist-row:last-child { border-bottom: none; }
  .checklist-dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
  .checklist-dot.good { background: #0ca30c; }
  .checklist-dot.warning { background: #fab219; }
  .checklist-dot.critical { background: #d03b3b; }
  .checklist-dot.pending { background: var(--baseline); }
  .checklist-label { flex: 1; }
  .checklist-status { font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .02em; padding: 2px 8px; border-radius: 999px; flex: none; }
  .checklist-status.good { color: #0ca30c; background: rgba(12,163,12,0.12); }
  .checklist-status.warning { color: #8A6D00; background: rgba(250,178,25,0.18); }
  .checklist-status.critical { color: #d03b3b; background: rgba(208,59,59,0.12); }
  .checklist-status.pending { color: var(--text-primary); background: var(--page-plane); }
  .extra-skills { margin-top: 14px; border-top: 1px solid var(--gridline); padding-top: 12px; }
  .extra-skills .field-value { font-size: 13px; }

<div class="viz-root">
<div class="wrap">

  <header class="top">
    <div>
      <h1 id="jdTitleEl">Senior Automation SDET (IA) — Outpost QA</h1>
      <p class="subtitle" id="jdSubtitleEl"></p>
      <p class="updated" data-i18n="updatedLabel"></p>
    </div>
    <div class="toggle-group">
      <button class="toggle-btn accent" id="langBtn" onclick="toggleLang()"></button>
    </div>
  </header>

  <div class="tab-bar" id="tabBar"></div>

  <div id="homeView"></div>

  <div id="positionView">
  <section>
    <h2 class="accent-red"><span data-i18n="statStatusLabel"></span></h2>
    <p class="section-hint" data-i18n="statStatusHint"></p>
    <div class="card" id="statusCard"></div>
  </section>

  <section>
    <h2 class="accent-blue"><span id="overviewTitleText"></span></h2>
    <p class="section-hint" id="overviewHintText"></p>
    <div class="evolution-grid" id="overviewCard"></div>
  </section>

  <section>
    <h2 class="accent-brown"><span data-i18n="analysisTitle"></span></h2>

  </section>

  <section>
    <h2 class="accent-red"><span data-i18n="candidatesTitle"></span></h2>

    <div id="candidatesList"></div>
  </section>

  <section>
    <h2 class="accent-yellow"><span data-i18n="companiesTitle"></span></h2>
    <p class="section-hint" data-i18n="companiesHint"></p>

    <div id="companiesList"></div>
  </section>
  </div>


</div>

<script>
  var CALL_DATA_MIN_ITEMS = 4;

  function emptyChecklist(reqs) {
    var c = {};
    reqs.forEach(function(i) { c[i.key] = ""; });
    return c;
  }

  // Se considera que ya hay datos de llamada capturados cuando al menos 4
  // de los puntos del checklist de la vacante tienen un valor (Verde/Amarillo/Rojo/NA, etc.).
  function hasCallData(c, cfg) {
    var filled = cfg.requirements.filter(function(i) { return (c.checklist[i.key] || '').trim(); }).length;
    return filled >= CALL_DATA_MIN_ITEMS;
  }

  // Etapas del proyecto — mueve currentStepIndex conforme avanza (0 = primera etapa). Compartidas por las 3 vacantes.
  var PROJECT_STEPS = [
    { key: "marketResearch", es: "Investigación de mercado", en: "Market research" },
    { key: "marketResearchClosed", es: "Investigación cerrada", en: "Market research closed" },
    { key: "workingJD", es: "Trabajando en Job Description", en: "Working on Job Description" },
    { key: "salaryDetermined", es: "Rango salarial determinado", en: "Salary range determined" },
    { key: "positionFinalized", es: "Posición finalizada", en: "Position finalized" }
  ];

  // Niveles de seniority por años de experiencia (definidos por Outpost) — por ahora
  // solo definidos para SDET; en las otras vacantes se muestra el rango de años sin nivel.
  var SDET_SENIORITY_LEVELS = [
    { key: "L1", min: 0, max: 2 },
    { key: "L2", min: 3, max: 5 },
    { key: "L3", min: 6, max: Infinity }
  ];
  function seniorityLevel(years, cfg) {
    if (!cfg.hasSeniorityLevels || years === null || years === undefined) return null;
    for (var i = 0; i < cfg.seniorityLevels.length; i++) {
      var lvl = cfg.seniorityLevels[i];
      if (years >= lvl.min && years <= lvl.max) return lvl.key;
    }
    return null;
  }

  var SDET_REQUIREMENTS = [
    { key: "ingles", es: "Inglés B2 o superior", en: "English B2 or higher" },
    { key: "experiencia", es: "6+ años de experiencia en ingeniería de software", en: "6+ years of software engineering experience" },
    { key: "typescript", es: "2+ años de experiencia con TypeScript", en: "2+ years of experience with TypeScript" },
    { key: "playwright", es: "3+ años de experiencia con Playwright", en: "3+ years of experience with Playwright" },

  function fieldOrPending(val, t) {

    if (!cfg.candidates.length) {
      document.getElementById('candidatesList').innerHTML = '<div class="empty-state"><strong>' + t.candidatesEmptyTitle + '</strong><span>' + t.candidatesEmptyBody + '</span></div>';

    var html = cfg.candidates.map(function(c) {
      var callDataDone = hasCallData(c, cfg);
      var nameHtml = callDataDone ? '<span class="candidate-name-done">' + c.name + '</span>' : c.name;
      var badgeHtml = callDataDone ? '' : ' <span class="candidate-badge">' + t.candidateBadgePending + '</span>';
      var zohoField = c.zoho && c.zoho.trim()
        ? '<div class="field-value"><a href="' + c.zoho + '" target="_blank" rel="noopener">' + t.viewProfile + '</a></div>'

        '<summary class="candidate-summary"><span class="ag-name">' + nameHtml + '</span>' + atAGlance(c, cfg, lang) + '<span class="chev" style="margin-left:auto">▾</span></summary>' +
        '<div class="candidate-body"><div class="field-grid">' +
          '<div><div class="field-label">' + t.fieldName + '</div><div class="field-value">' + c.name + '</div></div>' +
          '<div><div class="field-label">' + t.fieldHeadline + '</div>' + linkedinField + '</div>' +
          '<div><div class="field-label">' + t.fieldZoho + '</div>' + zohoField + '</div>' +
          '<div><div class="field-label">' + t.fieldAge + '</div>' + fieldOrPending(c.age, t) + '</div>' +
          '<div><div class="field-label">' + t.fieldLocation + '</div>' + fieldOrPending(c.location, t) + '</div>' +
          '<div><div class="field-label">' + t.fieldSeniority + '</div>' + fieldOrPending(c.seniority, t) + '</div>' +
          '<div><div class="field-label">' + t.fieldAiTools + '</div>' + fieldOrPending(c.tools, t) + '</div>' +
          '<div><div class="field-label">' + t.fieldLanguages + '</div>' + fieldOrPending(c.languages, t) + '</div>' +

        '</div>' +
        '</div>' +
      '</details>';

  function callsCompletedCount(cfg) {

  function renderTimeline(lang) {

    var stepsHtml = PROJECT_STEPS.map(function(step, i) {
      var state = i < cfg.currentStepIndex ? 'done' : (i === cfg.currentStepIndex ? 'current' : 'upcoming');
      var dotContent = state === 'done' ? '✓' : String(i + 1);
      return '<div class="timeline-step ' + state + '">' +

        '<div class="stat-tile accent-brown"><div class="stat-label">' + t.statCallsLabel + '</div><div class="stat-value">' + callsDone + '</div></div>' +

    var noteEl = document.getElementById('candidatesProgressNote');

      noteEl.textContent = t.candidatesProgress.replace('{done}', callsDone).replace(/\{total\}/g, total);

  function renderModeChart(lang, cfg) {
    var t = translations[lang];
    var total = cfg.candidates.length;
    var order = ['good', 'warning', 'critical', 'pending'];

    var rows = cfg.requirements.map(function(item) {
      var counts = { good: 0, warning: 0, critical: 0, pending: 0 };
      cfg.candidates.forEach(function(c) {
        counts[statusInfo(c.checklist[item.key])]++;
      });
      var segs = order.map(function(k) {
        if (!counts[k]) return '';
        var pct = (counts[k] / total * 100);
        return '<div class="mode-seg ' + k + '" style="width:' + pct + '%" title="' + t.statusLabels[k] + ': ' + counts[k] + '"></div>';
      }).join('');
      return '<div class="mode-row">' +
          '<div class="mode-row-label">' + item[lang] + '</div>' +
          '<div class="mode-bar">' + segs + '</div>' +
        '</div>';
    }).join('');

    var legend = order.map(function(k) {
      return '<span class="mode-legend-item"><span class="mode-legend-dot ' + k + '"></span>' + t.statusLabels[k] + '</span>';
    }).join('');

    return '<div class="mode-chart">' + rows + '</div><div class="mode-legend">' + legend + '</div>';
  }

  function topTools(n, cfg) {
    var freq = {};
    cfg.candidates.forEach(function(c) {
      (c.aiToolTags || []).forEach(function(tag) { freq[tag] = (freq[tag] || 0) + 1; });
    });
    return Object.keys(freq).map(function(k) { return { tag: k, count: freq[k] }; })
      .sort(function(a, b) { return b.count - a.count || a.tag.localeCompare(b.tag); })
      .slice(0, n);
  }

  function chipList(list) {
    if (!list.length) return '';
    return '<div class="chip-list">' + list.map(function(v) { return '<span class="chip">' + v + '</span>'; }).join('') + '</div>';
  }

  // Todas las cifras de salario capturadas se registran en pesos mexicanos (MXN),
  // brutos antes de impuestos, con base en el último salario reportado por el
  // candidato — por eso ya no se exige el texto "MXN" para reconocer el valor.
  function parseSalaryAmount(str) {
    var s = str || '';
    var m = s.replace(/,/g, '').match(/\$?\s*(\d{2,7})/);
    return m ? parseInt(m[1], 10) : null;
  }

  function salaryRangeText(cfg) {
    var values = cfg.candidates.map(function(c) { return parseSalaryAmount(c.salary); }).filter(function(v) { return v !== null; });
    if (!values.length) return null;
    var min = Math.min.apply(null, values), max = Math.max.apply(null, values);
    var fmt = function(n) { return '$' + n.toLocaleString('es-MX'); };
    return { text: (min === max ? fmt(min) + ' MXN' : fmt(min) + ' – ' + fmt(max) + ' MXN'), n: values.length };
  }

  // Los campos de edad son texto libre ("30 años aproximado", "No proporcionado",
  // etc.) — se toma el primer número que aparezca como la edad aproximada.
  function parseAgeYears(str) {
    var s = str || '';
    var m = s.match(/(\d{1,3})/);
    return m ? parseInt(m[1], 10) : null;
  }

  function ageRangeText(lang, cfg) {
    var values = cfg.candidates.map(function(c) { return parseAgeYears(c.age); }).filter(function(v) { return v !== null; });
    if (!values.length) return null;
    var min = Math.min.apply(null, values), max = Math.max.apply(null, values);
    var unit = function(n) { return lang === 'es' ? (n === 1 ? ' año' : ' años') : (n === 1 ? ' yr' : ' yrs'); };
    return { text: (min === max ? (min + unit(min)) : (min + ' – ' + max + unit(max))), n: values.length };
  }

  function rhEsc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

  function rhSvgHBar(items) {
    var max = Math.max.apply(null, items.map(function(i) { return i.n; })) || 1;
    var rowH = 26, gap = 11, padL = 250, padR = 46, W = 680;
    var H = items.length * (rowH + gap) + 6;
    var body = items.map(function(it, i) {
      var y = i * (rowH + gap) + 4;
      var w = (it.n / max) * (W - padL - padR);
      return '<text x="' + (padL - 10) + '" y="' + (y + rowH / 2 + 4) + '" text-anchor="end" class="svg-lbl">' + rhEsc(it.label) + '</text>' +
        '<rect x="' + padL + '" y="' + y + '" width="' + Math.max(w, 2) + '" height="' + rowH + '" rx="4" class="svg-bar' + (it.muted ? ' svg-bar-muted' : '') + (it.g ? ' svg-bar-g' : '') + '"/>' +
        '<text x="' + (padL + Math.max(w, 2) + 8) + '" y="' + (y + rowH / 2 + 4) + '" class="svg-val">' + (it.disp != null ? it.disp : it.n) + '</text>';
    }).join('');
    return '<svg viewBox="0 0 ' + W + ' ' + H + '" class="rh-svg" preserveAspectRatio="xMidYMid meet" role="img">' + body + '</svg>';
  }

  function rhSvgVBars(items) {
    var max = Math.max.apply(null, items.map(function(i) { return i.n; })) || 1;
    var W = 680, H = 250, padB = 46, padT = 22, padL = 20, padR = 20;
    var n = items.length, step = (W - padL - padR) / n, bw = step * 0.62;
    var body = items.map(function(it, i) {
      var x = padL + i * step + (step - bw) / 2;
      var h = (it.n / max) * (H - padB - padT);
      var y = H - padB - h;
      return '<rect x="' + x + '" y="' + y + '" width="' + bw + '" height="' + Math.max(h, 1) + '" rx="3" class="svg-bar' + (it.hi ? ' svg-bar-hi' : '') + '"/>' +
        '<text x="' + (x + bw / 2) + '" y="' + (y - 6) + '" text-anchor="middle" class="svg-val">' + (it.n || '') + '</text>' +
        '<text x="' + (x + bw / 2) + '" y="' + (H - padB + 18) + '" text-anchor="middle" class="svg-lbl-sm">' + rhEsc(it.label) + '</text>';
    }).join('');
    return '<svg viewBox="0 0 ' + W + ' ' + H + '" class="rh-svg" preserveAspectRatio="xMidYMid meet" role="img">' + body + '</svg>';
  }

  function renderRHAnalysis(lang, cfg) {
    var t = translations[lang];
    var a = cfg.rhAnalysis;
    var fmt = function(x) { return '$' + Number(x).toLocaleString('es-MX'); };
    var zonas = a.zonas.map(function(z) { return { label: z.label, n: z.n, muted: /sin ciudad|not specify|Mexico|México/i.test(z.label) && z.n === Math.max.apply(null, a.zonas.map(function(q){return q.n;})) }; });
    var zonasSvg = rhSvgHBar(zonas);
    var _sortedN = a.salaryBuckets.map(function(b) { return b.n; }).sort(function(x, y) { return y - x; });
    var _thresh = _sortedN.length > 1 ? _sortedN[1] : _sortedN[0];
    var buckets = a.salaryBuckets.map(function(b) { return { label: b.label, n: b.n, hi: b.n > 0 && b.n >= _thresh }; });
    var salSvg = rhSvgVBars(buckets);
    var fuentes = a.fuentes.map(function(f) {
      return '<div class="rh-chip' + (f.primary ? ' rh-chip-primary' : '') + '">' +
        '<span class="rh-chip-name">' + rhEsc(f.label) + '</span>' +
        (f.n ? '<span class="rh-chip-n">' + f.n + '</span>' : '') +
        '<span class="rh-chip-tag">' + rhEsc(f.tag[lang]) + '</span></div>';
    }).join('');
    var req = a.requisitos.map(function(r) { return '<li>' + rhEsc(r[lang]) + '</li>'; }).join('');
    var imp = a.implicaciones.map(function(r) { return '<li>' + rhEsc(r[lang]) + '</li>'; }).join('');
    var html = '<div class="rh-analysis">' +
      '<div class="rh-block"><h3 class="rh-h">' + t.rhZonasTitle + '</h3><p class="rh-note">' + (a.zonasNote ? a.zonasNote[lang] : t.rhZonasNote) + '</p>' + zonasSvg + '</div>' +
      '<div class="rh-block"><h3 class="rh-h">' + t.rhSalaryTitle + '</h3>' +
        '<div class="rh-salstats">' +
          '<div class="rh-salstat"><div class="rh-salstat-v">' + fmt(a.median) + '</div><div class="rh-salstat-l">' + t.rhMedian + '</div></div>' +
          '<div class="rh-salstat"><div class="rh-salstat-v">' + fmt(a.avg) + '</div><div class="rh-salstat-l">' + t.rhAvg + '</div></div>' +
          '<div class="rh-salstat"><div class="rh-salstat-v">' + fmt(a.absMin) + '–' + fmt(a.absMax) + '</div><div class="rh-salstat-l">' + t.rhRange + '</div></div>' +
        '</div>' + salSvg +
        '<p class="rh-note">' + (a.salaryNote ? a.salaryNote[lang] : t.rhSalaryNote).replace('{ws}', a.withSalary).replace('{n}', a.n) + '</p></div>' +
      '<div class="rh-grid2">' +
        '<div class="rh-block"><h3 class="rh-h">' + t.rhFuentesTitle + '</h3><div class="rh-chips">' + fuentes + '</div></div>' +
        '<div class="rh-block"><h3 class="rh-h">' + t.rhReqTitle + '</h3><ul class="rh-list">' + req + '</ul></div>' +
      '</div>' +
      (a.byCompany ? '<div class="rh-block"><h3 class="rh-h">' + t.rhByCompanyTitle + '</h3>' + rhSvgHBar(a.byCompany.map(function(x){return {label:x.label,n:x.n,muted:/no especific|not specified/i.test(x.label)};})) + '</div>' : '') +
      '<div class="rh-block rh-impl"><h3 class="rh-h">' + t.rhImplTitle + '</h3><ul class="rh-list">' + imp + '</ul></div>' +
      '<p class="rh-meta">' + (a.meta ? a.meta[lang] : t.rhMeta) + '</p></div>';
    document.getElementById('analysisCard').innerHTML = html;
  }

  function renderAnalysis(lang) {
    var cfg = JD_CONFIGS[currentJD];
    var t = translations[lang];
    if (cfg.vacancyMode) { if (cfg.rhAnalysis) { renderRHAnalysis(lang, cfg); } return; }
    var total = cfg.candidates.length;

    if (!total) {
      document.getElementById('analysisCard').innerHTML = '<div class="empty-state"><strong>' + t.analysisEmptyTitle + '</strong><span>' + t.analysisEmptyBody + '</span></div>';
      return;
    }

    renderCandidateCharts(lang, cfg);
  }


  var HOME_COLORS = { sdet:'#BB240A', hardware:'#322470', bdr:'#623F1B', rh:'#2E9E5B', scm:'#E0A82E' };
  function shortMoney(n){ if(n==null) return null; return n>=1000 ? ('$'+Math.round(n/1000)+'k') : ('$'+n); }
  function homeSalaryRange(cfg){
    if(cfg.vacancyMode && cfg.rhAnalysis){ return {min:cfg.rhAnalysis.absMin, max:cfg.rhAnalysis.absMax}; }
    var vals=(cfg.candidates||[]).map(function(c){return parseSalaryAmount(c.salary);}).filter(function(v){return v!=null;});
    if(!vals.length) return null; return {min:Math.min.apply(null,vals), max:Math.max.apply(null,vals)};
  }
  function homeTopCities(cfg){
    if(cfg.vacancyMode && cfg.rhAnalysis){ return cfg.rhAnalysis.zonas.slice(0,3).map(function(z){return z.label.replace(/\s*\(.*/,'').replace(/M[eé]xico \(sin especificar\)/,'México');}).join(' · '); }
    var freq={}; (cfg.candidates||[]).forEach(function(c){ var city=((c.location||'').split(',')[0].trim()); if(city){freq[city]=(freq[city]||0)+1;} });
    var keys=Object.keys(freq).sort(function(a,b){return freq[b]-freq[a];}).slice(0,3);
    return keys.length ? keys.join(' · ') : '—';
  }
  function renderHome(lang){
    var t=translations[lang];
    var cards=JD_ORDER.map(function(id){
      var cfg=JD_CONFIGS[id]; var mkt=!!cfg.vacancyMode; var s1,l1,s2,l2;
      if(mkt){ var a=cfg.rhAnalysis||{}; s1=a.n||0; l1=t.homeVacancies; s2=a.median?('$'+Math.round(a.median/1000)+'k'):'—'; l2=t.homeMedian; }
      else { s1=(cfg.candidates||[]).length; l1=t.homeCandidates; s2=callsCompletedCount(cfg); l2=t.homeCalls; }
      var sr=homeSalaryRange(cfg); var srTxt=sr?(shortMoney(sr.min)+'–'+shortMoney(sr.max)):'—';
      var cities=homeTopCities(cfg);
      var color=HOME_COLORS[id]||'#322470'; var step=(cfg.currentStepIndex||0)+1;
      var statusL=PROJECT_STEPS[cfg.currentStepIndex]?PROJECT_STEPS[cfg.currentStepIndex][lang]:'';
      return '<div class="pcard" onclick="switchJD(\''+id+'\')">'+
        '<span class="pbar" style="background:'+color+'"></span>'+
        '<span class="ptag '+(mkt?'mkt':'cand')+'">'+(mkt?t.homeTagMarket:t.homeTagCand)+'</span>'+
        '<h3 class="ph3">'+cfg.tabLabel[lang]+'</h3>'+
        '<div class="pstat"><div><div class="pv">'+s1+'</div><div class="pl">'+l1+'</div></div>'+
          '<div><div class="pv">'+s2+'</div><div class="pl">'+l2+'</div></div></div>'+
        '<div class="pmeta"><span class="pml">'+t.homeSalary+'</span><span class="pmv">'+srTxt+'</span></div>'+
        '<div class="pmeta"><span class="pml">'+t.homeCities+'</span><span class="pmv">'+cities+'</span></div>'+
        '<div class="pstep"><span class="ppill">'+t.homeStep+' '+step+'/5</span> '+statusL+'</div>'+
        '<span class="pgo">'+t.homeOpen+'</span></div>';
    }).join('');
    document.getElementById('homeView').innerHTML='<div class="home-grid">'+cards+'</div>';
  }
  function shortSalaryTxt(c){ var v=parseSalaryAmount(c.salary); return v!=null?('$'+Math.round(v/1000)+'k'):null; }
  function candLevelTxt(c, lang){
    var m=(c.name||'').match(/\bL[1-3]\b/); if(m) return m[0];
    var s=(c.seniority||''); var sm=s.match(/\b(Principal|Senior|Semi[- ]?senior|Junior|Mid|Lead)\b/i); if(sm) return sm[0];
    if(typeof c.yearsExperience==='number'){ return (c.yearsApprox?'~':'')+c.yearsExperience+(c.yearsPlus?'+':'')+(lang==='es'?' años':' yrs'); }
    return null;
  }
  function ratingDotsHtml(c, cfg){
    if(!hasCallData(c,cfg)) return '';
    var v=0,a=0,r=0; cfg.requirements.forEach(function(it){ var s=statusInfo(c.checklist[it.key]); if(s==='good')v++; else if(s==='warning')a++; else if(s==='critical')r++; });
    var d=''; var i; for(i=0;i<v;i++)d+='<span class="ag-dot ag-g"></span>'; for(i=0;i<a;i++)d+='<span class="ag-dot ag-a"></span>'; for(i=0;i<r;i++)d+='<span class="ag-dot ag-r"></span>';
    return d?'<span class="ag-rate" title="verde / amarillo / rojo">'+d+'</span>':'';
  }
  function atAGlance(c, cfg, lang){
    var t=translations[lang];
    if(!hasCallData(c,cfg)){
      var lp=(c.location&&c.location.trim())?'<span class="ag-chip ag-loc">'+rhEsc(c.location)+'</span>':'';
      return '<span class="ag-wrap"><span class="ag-chip ag-pend">'+t.candidateBadgePending+'</span>'+lp+'</span>';
    }
    var lvl=candLevelTxt(c,lang); var sal=shortSalaryTxt(c); var chips='';
    if(lvl) chips+='<span class="ag-chip ag-lvl">'+rhEsc(lvl)+'</span>';
    if(sal) chips+='<span class="ag-chip ag-sal">'+sal+'/mes</span>';
    if(c.location&&c.location.trim()) chips+='<span class="ag-chip ag-loc">'+rhEsc(c.location)+'</span>';
    return '<span class="ag-wrap">'+chips+ratingDotsHtml(c,cfg)+'</span>';
  }
  function renderCandidateCharts(lang, cfg){
    var t=translations[lang]; var cands=cfg.candidates; var total=cands.length; var done=callsCompletedCount(cfg);
    var byLoc={};
    cands.forEach(function(c){ var v=parseSalaryAmount(c.salary); if(v==null) return; var city=((c.location||'').split(',')[0].trim())||'—'; (byLoc[city]=byLoc[city]||[]).push(v); });
    var salItems=Object.keys(byLoc).map(function(k){ var arr=byLoc[k]; var avg=Math.round(arr.reduce(function(x,y){return x+y;},0)/arr.length); return {label:k,n:avg,disp:'$'+Math.round(avg/1000)+'k'}; }).sort(function(a,b){return b.n-a.n;});
    var lc={}; cands.forEach(function(c){ var city=((c.location||'').split(',')[0].trim())||'—'; lc[city]=(lc[city]||0)+1; });
    var locItems=Object.keys(lc).map(function(k){return {label:k,n:lc[k]};}).sort(function(a,b){return b.n-a.n;});
    var svals=cands.map(function(c){return parseSalaryAmount(c.salary);}).filter(function(v){return v!=null;}).sort(function(a,b){return a-b;});
    var srTxt=svals.length?('$'+Number(svals[0]).toLocaleString('es-MX')+' – $'+Number(svals[svals.length-1]).toLocaleString('es-MX')):'—';
    function box(title,note,svg){ return '<div class="rh-block"><h3 class="rh-h">'+title+'</h3>'+(note?'<p class="rh-note">'+note+'</p>':'')+svg+'</div>'; }
    var stats='<div class="rh-salstats">'+
      '<div class="rh-salstat"><div class="rh-salstat-v">'+total+'</div><div class="rh-salstat-l">'+t.homeCandidates+'</div></div>'+
      '<div class="rh-salstat"><div class="rh-salstat-v">'+done+'</div><div class="rh-salstat-l">'+t.chartDone+'</div></div>'+
      '<div class="rh-salstat"><div class="rh-salstat-v">'+srTxt+'</div><div class="rh-salstat-l">'+t.chartSalRange+'</div></div>'+
    '</div>';
    var salChart=salItems.length?box(t.chartSalaryByLoc,t.chartSalaryByLocNote,rhSvgHBar(salItems)):'<div class="rh-block"><h3 class="rh-h">'+t.chartSalaryByLoc+'</h3><p class="rh-note">'+t.chartSalaryEmpty+'</p></div>';
    var locChart=locItems.length?box(t.chartCandByLoc,'',rhSvgHBar(locItems)):'';
    var callChart=box(t.chartCallStatus,'',rhSvgHBar([{label:t.chartDone,n:done,disp:done,g:true},{label:t.chartPending,n:total-done,disp:total-done}]));
    document.getElementById('analysisCard').innerHTML='<div class="rh-analysis">'+stats+salChart+'<div class="rh-grid2">'+locChart+callChart+'</div></div>';
  }

  function applyLang(lang) {
    document.querySelectorAll('[data-i18n]').forEach(function(el) {
      var key = el.getAttribute('data-i18n');
      if (translations[lang][key] !== undefined) el.textContent = translations[lang][key];
    });
    document.getElementById('langBtn').textContent = lang === 'es' ? 'English' : 'Español';
    document.documentElement.setAttribute('lang', lang);
    renderTabs(lang);
    var homeEl=document.getElementById('homeView'), posEl=document.getElementById('positionView');
    if (currentJD === 'home' || !JD_CONFIGS[currentJD]) {
      if(homeEl) homeEl.style.display=''; if(posEl) posEl.style.display='none';
      document.getElementById('jdTitleEl').textContent = translations[lang].homeTitle;
      document.getElementById('jdSubtitleEl').textContent = translations[lang].homeSubtitle;
      renderHome(lang); window.scrollTo(0,0); return;
    }
    if(homeEl) homeEl.style.display='none'; if(posEl) posEl.style.display='';
    var cfg = JD_CONFIGS[currentJD];
    document.getElementById('jdTitleEl').textContent = cfg.title[lang];
    document.getElementById('jdSubtitleEl').textContent = cfg.subtitle[lang];
    renderOverview(lang);
    renderTimeline(lang);
    renderAnalysis(lang);
    renderCandidates(lang);
    renderCompanies(lang);

    var compListEl = document.getElementById('companiesList');
    var compSection = compListEl ? compListEl.closest('section') : null;
    if (cfg.vacancyMode) {
      if (compSection) compSection.style.display = 'none';
      var ov = function(sel, val) { var el = document.querySelector(sel); if (el && val !== undefined) el.textContent = val; };
      ov('[data-i18n="statStatusHint"]', translations[lang].statStatusHintVacancy);
      ov('[data-i18n="analysisTitle"]', translations[lang].analysisTitleVacancy);
      ov('[data-i18n="analysisHint"]', translations[lang].analysisHintVacancy);
    } else if (compSection) {
      compSection.style.display = '';
    }
  }

  function toggleLang() { currentLang = currentLang === 'es' ? 'en' : 'es'; applyLang(currentLang); }
  function toggleTheme() { var root = document.documentElement; var current = root.getAttribute('data-theme'); root.setAttribute('data-theme', current === 'dark' ? 'light' : 'dark'); }

  applyLang(currentLang);
</script>
</body>
</html>
